<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Sync settings — DarkDrive</title>
<!-- Same palette as the /api/devices/pair page, so pairing feels like one flow. -->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font:14px/1.5 system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5;
    display:flex;flex-direction:column;gap:16px;height:100vh}
  header{display:flex;align-items:center;gap:12px}
  header img{width:32px;height:32px}
  h1{margin:0;font-size:18px;font-weight:600}
  #version{flex:1;font-size:12px;color:#737373}
  #status{font-size:12px;padding:2px 10px;border-radius:99px;background:#262626;color:#a3a3a3}
  #status[data-on=true]{background:#14532d;color:#86efac}
  .card{padding:20px;border:1px solid #262626;border-radius:12px;background:#111;display:grid;gap:12px}
  label{display:grid;gap:4px;font-size:12px;color:#a3a3a3}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  input,button{font:inherit;border-radius:8px;border:1px solid #333;padding:8px 12px}
  input{background:#0a0a0a;color:#e5e5e5;width:100%}
  button{background:#1f1f1f;color:#e5e5e5;cursor:pointer;white-space:nowrap}
  button:hover{background:#2a2a2a}
  button.primary{background:#e5e5e5;color:#0a0a0a;border:0;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:1px}
  .account{display:flex;align-items:center;gap:12px}
  #account{flex:1}
  .note{font-size:11px;color:#737373}
  #hint{font-size:12px;color:#a3a3a3}
  #hint:empty{display:none}
  details{display:grid;gap:12px}
  details[open]{padding-bottom:4px}
  summary{cursor:pointer;font-size:12px;color:#a3a3a3;margin-bottom:8px}
  details label{margin-bottom:12px}
  #error{color:#fbbf24;font-size:12px}
  #error:empty{display:none}
  h2{margin:0;font-size:14px;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  #folders{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  #folders li{display:flex;align-items:center;gap:8px}
  #folders li div{flex:1;min-width:0;display:grid}
  #folders .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #available{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  #available:empty{display:none}
  #available .note{flex-basis:100%}
  #log{flex:1;min-height:120px;margin:0;overflow:auto;padding:12px;background:#111;border:1px solid #262626;
    border-radius:12px;font:12px/1.6 ui-monospace,monospace;color:#a3a3a3;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <h1>DarkDrive</h1>
  <span id="version"></span>
  <span id="status" role="status">Paused</span>
  <button id="toggle" type="button" hidden>Resume</button>
  <button id="drive" type="button" hidden>Open DarkDrive</button>
</header>

<button id="update" class="primary" type="button" hidden></button>
<div id="error" role="alert"></div>

<form id="form" class="card">
  <div class="account">
    <span id="account">Not signed in</span>
    <button id="signin" type="button">Sign in with Google</button>
  </div>
  <div id="hint"></div>
  <label>Device name
    <input name="device">
  </label>
  <details>
    <summary>Advanced</summary>
    <label>Server
      <input name="apiUrl" type="url" required>
    </label>
    <label>Web app
      <input name="webUrl" type="url" required>
    </label>
    <label>Device token
      <input name="token" type="password" placeholder="dd_…" autocomplete="off">
    </label>
  </details>
  <button id="save" type="submit">Save</button>
</form>

<section class="card">
  <h2>Synced folders</h2>
  <ul id="folders"></ul>
  <p id="no-folders" class="note">Nothing syncs yet. Only the folders you add here are kept on this
    computer, never the rest of your drive.</p>
  <div class="actions">
    <button id="add-local" type="button">Sync a folder from this computer…</button>
    <button id="add-remote" type="button">Keep a synced folder here…</button>
  </div>
  <div id="available"></div>
</section>

<pre id="log" aria-label="Sync log"></pre>
<script type="module" src="../dist/renderer.js"></script>
</body>
</html>
